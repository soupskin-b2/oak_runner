name: probe-b

on:
  workflow_dispatch:

jobs:
  worker:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(vars.PROBE_MATRIX || '[{"idx":0,"os":"ubuntu-latest","v":"2.329.0"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Load credentials
        shell: bash
        env:
          IDX: ${{ matrix.idx }}
        run: |
          echo "idx=$IDX"
