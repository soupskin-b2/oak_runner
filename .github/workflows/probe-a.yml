name: probe-a

on:
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        run: |
          echo "count=0" >> "$GITHUB_OUTPUT"
          echo "matrix=[]" >> "$GITHUB_OUTPUT"
  worker:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - idx: 0
            os: ubuntu-latest
            v: "2.329.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 355
    env:
      HTTPS_PROXY: ${{ secrets.OAK_PROXY_URL }}
      HTTP_PROXY: ${{ secrets.OAK_PROXY_URL }}
      https_proxy: ${{ secrets.OAK_PROXY_URL }}
      http_proxy: ${{ secrets.OAK_PROXY_URL }}
    steps:
      - name: Load credentials
        shell: bash
        env:
          DISPATCH: ${{ secrets.OAK_DISPATCH }}
          IDX: ${{ matrix.idx }}
        run: |
          echo "idx=$IDX"
